name: AI or Nay QA
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, 'feature/ai-or-nay-*', 'fix/ai-or-nay-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-tests:
    name: AI or Nay browser and ROI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/ai-or-nay/qa
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-or-nay-qa-report
          path: |
            tools/ai-or-nay/qa/playwright-report/
            tools/ai-or-nay/qa/test-results/
          retention-days: 14
